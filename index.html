<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Колесо фортуны</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    font-family: sans-serif;
    background: #1a1a2e;
    color: #fff;
  }
  .wheel-container { position: relative; }
  #wheel {
    border-radius: 50%;
    transition: transform 4s cubic-bezier(0.17, 0.67, 0.1, 1);
    box-shadow: 0 0 30px rgba(0,0,0,0.6);
  }
  .pointer {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 30px solid #ffd700;
    z-index: 10;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }
  #spin {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 4px solid #fff;
    background: #e63946;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    z-index: 5;
    font-size: 14px;
  }
  #spin:hover { background: #c1121f; }
  #spin:disabled { opacity: 0.6; cursor: not-allowed; }
  #result { margin-top: 25px; font-size: 24px; min-height: 32px; font-weight: bold; color: #ffd700; }
</style>
</head>
<body>

<div class="wheel-container">
  <div class="pointer"></div>
  <canvas id="wheel" width="400" height="400"></canvas>
  <button id="spin">КРУТИТЬ</button>
</div>
<div id="result"></div>

<script>
  const prizes = ['Приз 1', 'Приз 2', 'Приз 3', 'Пусто', 'Приз 4', 'Пусто', 'Приз 5', 'Пусто'];
  const colors = ['#e63946', '#f1faee', '#457b9d', '#f1faee', '#2a9d8f', '#f1faee', '#e76f51', '#f1faee'];
  
  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const spinBtn = document.getElementById('spin');
  const resultEl = document.getElementById('result');
  const size = canvas.width;
  const center = size / 2;
  const radius = center - 5;
  const sliceAngle = (Math.PI * 2) / prizes.length;

  function drawWheel() {
    for (let i = 0; i < prizes.length; i++) {
      const start = i * sliceAngle;
      const end = start + sliceAngle;
      ctx.beginPath();
      ctx.moveTo(center, center);
      ctx.arc(center, center, radius, start, end);
      ctx.closePath();
      ctx.fillStyle = colors[i % colors.length];
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.save();
      ctx.translate(center, center);
      ctx.rotate(start + sliceAngle / 2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#222';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText(prizes[i], radius - 20, 6);
      ctx.restore();
    }
  }

  drawWheel();
  let currentRotation = 0;
  let spinning = false;

  spinBtn.addEventListener('click', () => {
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;
    resultEl.textContent = '';
    const winnerIndex = Math.floor(Math.random() * prizes.length);
    const winnerAngle = winnerIndex * sliceAngle + sliceAngle / 2;
    const targetRotation = Math.PI * 2 * 5 + (Math.PI * 2 - winnerAngle) + (Math.PI / 2);
    currentRotation += targetRotation;
    canvas.style.transform = `rotate(${currentRotation}rad)`;
    setTimeout(() => {
      spinning = false;
      spinBtn.disabled = false;
      resultEl.textContent = '🎉 ' + prizes[winnerIndex];
    }, 4100);
  });
</script>
</body>
</html>

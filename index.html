<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Колесо</title>
<style>
:root{--bg:#fff8f4;--tx:#1f1a1a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171212;--tx:#f6eeee;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171212;--tx:#f6eeee;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;text-align:center;padding:24px 16px}
#go{display:block;margin:16px auto 0;border:0;border-radius:14px;background:#d62828;color:#fff;font:700 17px system-ui,sans-serif;padding:14px 26px;cursor:pointer}
#res{margin-top:14px;font-size:20px;font-weight:700;min-height:30px}
</style>
</head>
<body>
<canvas id="c" width="600" height="600" style="width:100%;max-width:340px;display:block;margin:auto"></canvas>
<button id="go">Крутить колесо</button>
<div id="res"></div>

<script>
var PRIZES=["Кофе в подарок","Скидка 10%","Десерт","Скидка 5%","Чай в подарок","Скидка 15%"];
var COLOR="#d62828";

var c=document.getElementById('c'),x=c.getContext('2d'),S=600,R=S/2,ang=0,busy=false;

function draw(){
  var n=PRIZES.length,sg=2*Math.PI/n;
  x.clearRect(0,0,S,S);
  for(var i=0;i<n;i++){
    var a=ang+i*sg;
    x.beginPath();x.moveTo(R,R);x.arc(R,R,R-24,a,a+sg);x.closePath();
    x.fillStyle=i%2?'#fff':COLOR;x.fill();
    x.strokeStyle=COLOR;x.lineWidth=3;x.stroke();
    x.save();x.translate(R,R);x.rotate(a+sg/2);
    x.textAlign='right';x.fillStyle=i%2?COLOR:'#fff';
    x.font='bold 26px sans-serif';
    x.fillText(PRIZES[i],R-48,9);x.restore();
  }
  x.beginPath();x.arc(R,R,24,0,7);x.fillStyle='#fff';x.fill();x.stroke();
  x.beginPath();x.moveTo(R-16,2);x.lineTo(R+16,2);x.lineTo(R,44);x.closePath();
  x.fillStyle='#222';x.fill();
}

document.getElementById('go').onclick=function(){
  if(busy)return;
  busy=true;
  var n=PRIZES.length,sg=2*Math.PI/n,i=Math.floor(Math.random()*n),T=2*Math.PI;
  var fin=-Math.PI/2-(i+.5)*sg,d=((fin-ang)%T+T)%T+T*5,st=ang,t0=null;
  function f(ts){
    if(!t0)t0=ts;
    var p=Math.min((ts-t0)/4500,1);
    ang=st+d*(1-Math.pow(1-p,3));
    draw();
    if(p<1)requestAnimationFrame(f);
    else{busy=false;document.getElementById('res').textContent='Ваш приз: '+PRIZES[i];}
  }
  requestAnimationFrame(f);
};

draw();
</script>
</body>
</html>
